<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly Dictionary</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Wordly Dictionary</h1>
    </header>
    <main>
        <form id="search-form">
            <label for="word-input">Enter a word:</label>
            <input type="text" id="word-input" placeholder="e.g., hello" required aria-describedby="search-help">
            <small id="search-help">Search for definitions, pronunciation, and more.</small>
            <button type="submit" id="search-btn">Search</button>
        </form>
        <div id="results" aria-live="polite"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
